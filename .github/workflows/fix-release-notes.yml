name: Fix Release Notes

# 手动补写/修正某个**已发布** Release 的正文与标题。
#
# ── 为什么需要它（2026-10-08）────────────────────────────────────────────────
# v0.1.5 的 Release 正文是 **12 遍重复的 `Full Changelog` 行**，一个字说明都没有，
# 而 v0.1.3 是有「新增 / 修复 / 优化 / 下载」的。根因是早期 build-macos.yml 的**两个
# matrix job** 都带 `generate_release_notes: true`，而 softprops 在 release 已存在时是
# **追加** → 那次为让 Windows 构建跑通移动了 6 次 tag = 2×6 = 12 行。
#
# 代码侧已在 build-macos.yml 里修好（独立的 release-notes job，从 CHANGELOG 抽取，
# 单一写入者），但那只对**下一次发版**生效 —— 历史 Release 需要一个能手动跑、
# 且**不会重跑构建**的补写通道。
#
# ⚠️ 不要用手跑 build-macos.yml 来补：它的 release-notes job 依赖 build-macos，
#    会连带重跑约 20 分钟 macOS 构建并重传三个资产。
#
# ── 用法 ────────────────────────────────────────────────────────────────────
# Actions 页 → 左侧选「Fix Release Notes」→ Run workflow → 填 tag（如 v0.1.5）→ Run。
# 副标题留空时取 `CHANGELOG.md` 里该版本标题行上的 `· 副标题`
# （例：`## [v0.1.5] - 2026-09-28 · 简单学` → 标题 `v0.1.5 · 简单学`）。
#
# ⚠️ 本 workflow 只改**文案**（正文 + 标题），不碰任何资产。
# ⚠️ 输入一律经 **step 级 `env:`** 交给 shell，绝不把 `${{ inputs.* }}` 内联进命令
#    （那等于把用户输入拼进 shell）；也没有放在 `jobs.<id>.env` ——
#    那里能否取到 `inputs` 上下文不稳妥，取不到会让下面的「没填 tag」守卫误报。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要补写的 Release tag（如 v0.1.5）"
        required: true
        type: string
      name_subtitle:
        description: "标题副标题（留空 = 用 CHANGELOG 标题行上的 · 副标题）"
        required: false
        type: string

jobs:
  fix-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 改 Release 正文需要写权限（默认只读 → gh 会报 Resource not accessible）
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # gh CLI 是 runner 自带的；显式探一下，坏了要一眼看出来。
      - name: 校验环境（gh + tag）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh --version
          if [ -z "$TAG" ]; then
            echo "::error title=没填 tag::请填写要补写的 Release tag，例如 v0.1.5"
            exit 1
          fi
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error title=Release 不存在::$TAG 没有对应的 Release —— 请核对 tag 名。本 workflow 只改文案，不会创建 Release。"
            exit 1
          fi
          echo "Release $TAG 存在，继续。"

      - name: 从 CHANGELOG 生成发布说明
        env:
          TAG: ${{ inputs.tag }}
          SUBTITLE: ${{ inputs.name_subtitle }}
        run: |
          python backend/scripts/extract_release_notes.py \
            --version "$TAG" --name-subtitle "$SUBTITLE"
          echo "========== 生成的正文 =========="
          cat backend/dist/release_body.md
          echo "================================="
          echo "Release 标题：$(cat backend/dist/release_name.txt)"

      # ⚠️ 用 `gh release edit` 而不是 softprops/action-gh-release：
      #    前者的语义就是「编辑既有 Release」——不会创建 Release、不会顺带改写
      #    draft/prerelease、也绝不会碰资产。这正是本 workflow 想要的。
      - name: 写回 Release 正文与标题
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          NAME=$(tr -d '\r\n' < backend/dist/release_name.txt)
          gh release edit "$TAG" --title "$NAME" --notes-file backend/dist/release_body.md
          echo "---- 回读核对 ----"
          gh release view "$TAG" --json tagName,name | cat
