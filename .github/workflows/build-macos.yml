name: Build macOS

# 触发方式：
#   1. 手动触发（Actions 页 → Run workflow）
#   2. 推送 v* 标签（git push origin v0.1.3）→ 自动打包并发布到 Releases
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    strategy:
      fail-fast: false   # 双架构互不影响：一个失败不取消另一个
      matrix:
        include:
          - os: macos-14        # Apple Silicon (arm64)
            arch: arm64
            label: Apple Silicon
          - os: macos-15-intel  # Intel (x86_64)，GitHub 最后一个 x86_64 macOS 镜像（可用到 2027-08）
            arch: x86_64
            label: Intel
    runs-on: ${{ matrix.os }}
    # 阶段 1 起本 job 多了两步真机动作：逐个 Mach-O 签名 + 逐项验证，以及原生外壳冒烟（90s 上限）。
    # 60 分钟的余量不足以覆盖「打包慢 + 签名慢」同时发生。
    # ⚠️ 2026-09-22（AI 浏览器下线）：包内不再有 PySide6（324.5 MB、数百个嵌套 bundle），
    #    打包与签名都会快很多；90 分钟先原样保留当余量，等下一轮拿到真实耗时可下调。
    timeout-minutes: 90
    # 允许 GITHUB_TOKEN 创建 release（默认只读，否则 softprops/action-gh-release 报 "Resource not accessible by integration"）
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 Python 依赖 + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: 打包 macOS 应用（${{ matrix.label }}）
        env:
          ARCH: ${{ matrix.arch }}
          # 若 HuggingFace 直连不稳，可切换国内镜像：
          # HF_ENDPOINT: https://hf-mirror.com
        run: bash backend/scripts/build_macos.sh

      # 2026-09-20 预检新增：原来的 job 在失败时**零 artifact** ——
      #   build_macos.sh exit 1 → 后续 step 全部跳过；而 sign_report.json /
      #   smoke_native_shell.json 本来就不在上传列表里。
      #   于是「唯一一次 macOS 跑批」一旦变红，只剩一份日志可查。
      # 这两步把三类证据无条件收走：体积、签名报告、外壳冒烟报告 + 应用原始输出。
      - name: 记录产物体积（WP10 证据）
        if: always()
        run: |
          mkdir -p backend/dist
          {
            echo "arch=${{ matrix.arch }}  runner=${{ matrix.os }}"
            ZIP="backend/dist/ai-study-companion-macos-${{ matrix.arch }}.zip"
            if [ -f "$ZIP" ]; then
              echo "zip_bytes=$(stat -f%z "$ZIP")"
              echo "zip_mb=$(du -m "$ZIP" | cut -f1)"
            else
              echo "zip_bytes=NA"
            fi
            if [ -d backend/dist/AIStudyCompanion.app ]; then
              echo "app_mb=$(du -sm backend/dist/AIStudyCompanion.app | cut -f1)"
            else
              echo "app_mb=NA"
            fi
          } > "backend/dist/size_report_${{ matrix.arch }}.txt" 2>&1 || true
          cat "backend/dist/size_report_${{ matrix.arch }}.txt" 2>/dev/null || true

      - name: 上传诊断证据（无论成败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-${{ matrix.arch }}
          path: |
            backend/dist/size_report_${{ matrix.arch }}.txt
            backend/dist/sign_report.json
            backend/dist/smoke_native_shell.json
            backend/dist/smoke_backend_stdout.txt
          if-no-files-found: ignore

      - name: 上传打包产物（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: ai-study-companion-macos-${{ matrix.arch }}
          path: backend/dist/ai-study-companion-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

      # ⚠️ 这里**只上传产物、绝不碰正文** —— 正文由文件末尾的 release-notes job 独占写入。
      #    原因见那个 job 的注释（两个 matrix job 各写一次会攒出重复行）。
      - name: 发布到 GitHub Releases（仅 tag 触发时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: backend/dist/ai-study-companion-macos-${{ matrix.arch }}.zip
          fail_on_unmatched_files: true

  # ── 发布说明：Release 正文的**唯一写入者** ────────────────────────────────
  # ⚠️⚠️ 为什么要单独开一个 job（2026-09-30 实测教训，别删）：
  #    原先两个 matrix job 都带 `generate_release_notes: true`，而 softprops 在
  #    release 已存在时是**追加**生成的说明 —— v0.1.5 的正文因此变成 **12 遍重复的
  #    「Full Changelog」链接**（本轮为让 Windows 构建跑通移动了 4 次 tag，2 个
  #    matrix job 每次各追加一行）。仓库 `CHANGELOG.md` 里明明写得很完整，
  #    却一个字都没进正文。
  #    现在：正文由 `backend/scripts/extract_release_notes.py` 从 CHANGELOG 抽取，
  #    且只在**这一个** job 写 → 结构上不可能重复。
  # ⚠️ 不要把它并回 matrix job，也不要给 matrix job 加回 generate_release_notes。
  # ⚠️ needs build-macos：matrix 失败时本 job 跳过，不写半截说明。
  release-notes:
    needs: build-macos
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 版本号从 tag 来（GITHUB_REF_NAME）；CHANGELOG 里没有该版本时**不判红**，
      # 而是把「为什么这里是空的」写进正文（这一步跑在产物上传之后，
      # 为一条文案把流水线判红得不偿失）。
      - name: 从 CHANGELOG 生成发布说明
        run: python backend/scripts/extract_release_notes.py

      - name: 写入 Release 正文
        uses: softprops/action-gh-release@v2
        with:
          body_path: backend/dist/release_body.md
