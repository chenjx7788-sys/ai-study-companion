name: Build macOS

# 触发方式：
#   1. 手动触发（Actions 页 → Run workflow）
#   2. 推送 v* 标签（git push origin v0.1.3）→ 自动打包并发布到 Releases
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    # Apple Silicon (arm64)：覆盖当前绝大多数 Mac 用户
    # 如需 Intel (x86_64) 包，另加一个 job 用 macos-13（若该 runner 已下线则改用自建）
    runs-on: macos-14
    timeout-minutes: 60
    # 允许 GITHUB_TOKEN 创建 release（默认只读，否则 softprops/action-gh-release 报 "Resource not accessible by integration"）
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 Python 依赖 + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: 打包 macOS 应用
        env:
          ARCH: arm64
          # 若 HuggingFace 直连不稳，可切换国内镜像：
          # HF_ENDPOINT: https://hf-mirror.com
        run: bash backend/scripts/build_macos.sh

      - name: 上传打包产物（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: ai-study-companion-macos-arm64
          path: backend/dist/ai-study-companion-macos-arm64.zip
          if-no-files-found: error

      - name: 发布到 GitHub Releases（仅 tag 触发时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: backend/dist/ai-study-companion-macos-arm64.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
