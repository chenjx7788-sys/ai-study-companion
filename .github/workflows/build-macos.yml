name: Build macOS

# 触发方式：
#   1. 手动触发（Actions 页 → Run workflow）
#   2. 推送 v* 标签（git push origin v0.1.3）→ 自动打包并发布到 Releases
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    strategy:
      fail-fast: false   # 双架构互不影响：一个失败不取消另一个
      matrix:
        include:
          - os: macos-14        # Apple Silicon (arm64)
            arch: arm64
            label: Apple Silicon
          - os: macos-15-intel  # Intel (x86_64)，GitHub 最后一个 x86_64 macOS 镜像（可用到 2027-08）
            arch: x86_64
            label: Intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # 允许 GITHUB_TOKEN 创建 release（默认只读，否则 softprops/action-gh-release 报 "Resource not accessible by integration"）
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 Python 依赖 + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: 打包 macOS 应用（${{ matrix.label }}）
        env:
          ARCH: ${{ matrix.arch }}
          # 若 HuggingFace 直连不稳，可切换国内镜像：
          # HF_ENDPOINT: https://hf-mirror.com
        run: bash backend/scripts/build_macos.sh

      - name: 上传打包产物（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: ai-study-companion-macos-${{ matrix.arch }}
          path: backend/dist/ai-study-companion-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

      - name: 发布到 GitHub Releases（仅 tag 触发时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: backend/dist/ai-study-companion-macos-${{ matrix.arch }}.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
